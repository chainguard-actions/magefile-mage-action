name: Test basic install-only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          install-only: 'true'
          cache-binary: 'false'
      - name: Assert mage is installed
        run: |
          which mage || (echo "FAIL: mage not found in PATH" && exit 1)
          echo "PASS: mage is installed"
