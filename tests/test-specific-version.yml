name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up tool cache directories
        run: |
          mkdir -p /tmp/hostedtoolcache
          mkdir -p /tmp/runner-temp
      - id: action
        uses: .
        with:
          version: 'v1.15.0'
          install-only: 'true'
          cache-binary: 'false'
        env:
          RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
          RUNNER_TEMP: /tmp/runner-temp
          AGENT_TOOLSDIRECTORY: /tmp/hostedtoolcache
        continue-on-error: true
      - name: Assert mage specific version is installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking mage is available on PATH..."
            if ! command -v mage >/dev/null 2>&1; then
              echo "FAIL: mage not found on PATH after successful install"
              exit 1
            fi
            MAGE_VERSION=$(mage --version 2>&1 || true)
            echo "mage version output: $MAGE_VERSION"
            if echo "$MAGE_VERSION" | grep -q "1.15.0"; then
              echo "PASS: mage version 1.15.0 is installed"
            else
              echo "FAIL: expected version 1.15.0 but got: $MAGE_VERSION"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (tool-cache env not fully available under act harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
